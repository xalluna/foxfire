# Foxfire Server, its database, and its blob store.
#
#   cp .env.example .env     # then fill it in — the server refuses to start otherwise
#   docker compose up -d
#
# Run this from apps/server/docker. The build context is the repository root
# because the Dockerfile needs the whole apps/server tree.
#
# This publishes plain HTTP on 8080 and binds it to localhost only. That is
# deliberate: put Caddy or nginx in front of it for TLS before you expose
# anything. Passwords and account tokens travel over this connection, and the
# desktop refuses a non-HTTPS server that is not localhost.

name: foxfire

services:
  server:
    build:
      context: ../../..
      dockerfile: apps/server/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=Foxfire;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      ConnectionStrings__Blob: "${BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://blob:10000/devstoreaccount1;}"

      # Where a *desktop* reaches the blob store, which is not where this
      # server reaches it. The line above is a name on this compose network;
      # the desktop uploading a replay is on somebody's PC and cannot resolve
      # it. Signed URLs are put on this address instead before being handed
      # out. Default suits a host trying the stack out on their own machine —
      # anyone whose friends are elsewhere sets BLOB_PUBLIC_URL to a name
      # those friends can reach.
      Storage__PublicUrl: "${BLOB_PUBLIC_URL:-http://localhost:10000}"
      Server__PublicUrl: "${SERVER_PUBLIC_URL}"
      Server__Name: "${SERVER_NAME:-Foxfire}"

      # Which reverse proxies to believe about a request's real address. The
      # port below is published on localhost only, so everything arrives here
      # through Docker's own proxy, from an address on a Docker network — which
      # is why the default trusts those networks and nothing else. See
      # .env.example before changing it.
      Server__TrustedProxies: "${TRUSTED_PROXIES:-}"
      Server__TrustedNetworks: "${TRUSTED_PROXY_NETWORKS:-172.16.0.0/12}"
      RateLimit__AuthPerMinute: "${RATE_LIMIT_AUTH_PER_MINUTE:-20}"
      RateLimit__SearchPerMinute: "${RATE_LIMIT_SEARCH_PER_MINUTE:-120}"
      Riot__ApiKey: "${RIOT_API_KEY}"
      Riot__KeyType: "${RIOT_KEY_TYPE:-personal}"
      Auth__JwtSigningKey: "${JWT_SIGNING_KEY}"
      Auth__InviteSigningKey: "${INVITE_SIGNING_KEY}"
      Admin__Email: "${ADMIN_EMAIL}"
      Auth__PasswordResetLifetime: "${PASSWORD_RESET_LIFETIME:-24:00:00}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-Foxfire}"

      # Logs go to the console and to a `logs` container in the blob store
      # above. See .env.example.
      Serilog__MinimumLevel__Default: "${LOG_LEVEL:-Information}"
      Logs__RetentionDays: "${LOG_RETENTION_DAYS:-30}"
      Logs__ToBlob: "${LOG_TO_BLOB:-true}"
      Logs__ConsoleFormat: "${LOG_CONSOLE_FORMAT:-text}"
      ConnectionStrings__Logs: "${LOG_CONNECTION_STRING:-}"

      # Somewhere else as well, or instead (set LOG_TO_BLOB=false for instead).
      # Uncomment one block and fill it in; any number can be on at once. These
      # are Serilog's own settings, spelled as environment variables — the word
      # after WriteTo__ is only a label.
      #
      # Files on a volume. Give this service `volumes: ["logs:/home/foxfire/logs"]`
      # and add `logs:` to the volumes at the bottom of this file. That path and
      # no other: the server does not run as root, and the image makes that
      # directory for it, owned by the user it runs as.
      # Serilog__WriteTo__file__Name: "File"
      # Serilog__WriteTo__file__Args__path: "/home/foxfire/logs/foxfire-.clef"
      # Serilog__WriteTo__file__Args__rollingInterval: "Day"
      # Serilog__WriteTo__file__Args__retainedFileCountLimit: "30"
      # Serilog__WriteTo__file__Args__formatter: "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
      #
      # An OpenTelemetry collector — or anything that takes OTLP: Grafana,
      # Datadog, Honeycomb, Azure Monitor, Seq.
      # Serilog__WriteTo__otlp__Name: "OpenTelemetry"
      # Serilog__WriteTo__otlp__Args__endpoint: "http://otel-collector:4317"
      # Serilog__WriteTo__otlp__Args__protocol: "Grpc"
      # OTEL_SERVICE_NAME: "foxfire-server"
      #
      # Seq.
      # Serilog__WriteTo__seq__Name: "Seq"
      # Serilog__WriteTo__seq__Args__serverUrl: "http://seq:5341"
      # Serilog__WriteTo__seq__Args__apiKey: ""
      #
      # Application Insights.
      # Serilog__WriteTo__appinsights__Name: "ApplicationInsights"
      # Serilog__WriteTo__appinsights__Args__connectionString: "InstrumentationKey=...;IngestionEndpoint=..."
      # Serilog__WriteTo__appinsights__Args__telemetryConverter: "Serilog.Sinks.ApplicationInsights.TelemetryConverters.TraceTelemetryConverter, Serilog.Sinks.ApplicationInsights"

      # What the server measures about itself, for the Insights page an admin
      # sees in the app. Kept in the database; see .env.example.
      Telemetry__RetentionDays: "${INSIGHTS_RETENTION_DAYS:-30}"
    ports:
      # Localhost only. Point your reverse proxy here; do not forward this port.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      # Express: free to run for real, capped at 10 GB per database. That is a
      # great deal of League history — matches are stored once and shared by
      # everybody on the server — but if you outgrow it, Developer is free and
      # uncapped for non-production use and Standard is the licensed option.
      MSSQL_PID: "${MSSQL_EDITION:-Express}"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      # The server waits for this. SQL Server takes a while to come up, and
      # starting the API against a database that is not listening yet turns a
      # slow boot into a crash loop.
      #
      # CMD-SHELL rather than CMD, for two reasons that both have to hold. Compose
      # rejects a test that does not begin with one of them outright, and the
      # password reaches the container as the literal string $MSSQL_SA_PASSWORD —
      # the doubled dollar is how a compose file escapes one — so something has to
      # expand it, and only a shell will.
      #
      # -C trusts the server certificate, which is self-signed here; without it
      # sqlcmd 18 refuses to connect at all and the container never reports
      # healthy.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  blob:
    # Azurite is Microsoft's Azure Storage emulator, and it speaks the real
    # Blob API — so a self-hoster gets object storage with no cloud account,
    # and a host who would rather use actual Azure just points
    # BLOB_CONNECTION_STRING at it instead and stops this service.
    #
    # A community that never uploads a replay needs none of this, and the
    # server says so at startup and carries on without it — everything that is
    # not a replay works either way.
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data"]
    # Published, because replays do not travel through the server — the
    # desktop is handed a signed URL and PUTs the bytes here itself. Without
    # this the store is reachable only by the one process that never carries
    # a replay.
    ports:
      - "${BLOB_PORT:-10000}:10000"
    volumes:
      - blob-data:/data

volumes:
  db-data:
  blob-data:
