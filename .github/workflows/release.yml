name: Release

# Publishes a GitHub Release whose body is that version's CHANGELOG.md section.
# The changelog is written by hand in the PR that bumps the version; this only
# copies it out, so the file and the Release can never disagree.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$version" != "$packaged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $packaged"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The heading is matched by exact string, so the version's dots are never
      # treated as wildcards. A section ends at the next heading or, for the
      # oldest release, at the link definitions that close the file.
      - name: Extract the changelog section
        run: |
          awk -v v="$VERSION" '
            BEGIN { heading = "## [" v "]" }
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[[0-9]+\.[0-9]+\.[0-9]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "LoL Stats $VERSION" \
            --notes-file notes.md
