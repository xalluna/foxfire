appId: com.brandonbarr.my-op-gg
productName: LoL Stats
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
